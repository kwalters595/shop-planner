<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Woodshop Floor Planner (19' x 28')</title>
  <style>
    /* Minimal Loader Styles */
    body { background-color: #141518; color: #f3f4f6; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .loader { text-align: center; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #d97706; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="loader" id="loadingScreen">
    <div class="spinner"></div>
    <h2 style="font-size: 1.1rem; margin-bottom: 5px;">Loading Shop Environment...</h2>
    <p style="font-size: 0.8rem; color: #9ca3af;">Fetching latest engine and layout from Google Sheets</p>
  </div>

  <script>
    // The Sheet Bridge Loader
    // This fetches the actual application HTML/JS/CSS directly from your Google Sheet
    const SHEET_ID = '1w13zKSX6lhYVByG-GgE0O1-OE7nN3qaA121VpGx7FaI';
    const GID_APPCODE = '0'; // We will set up a dedicated _AppCode tab in your sheet

    async function loadAppEngine() {
      try {
        // Fetch the raw code from the designated Google Sheet tab
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=_AppCode`);
        if (!res.ok) throw new Error('Failed to reach Google Sheets API');
        
        const csvText = await res.text();
        
        // Google Sheets CSV wraps cells in quotes and doubles up internal quotes. 
        // This cleans the payload back into raw HTML/JS.
        let rawCode = csvText.replace(/^"|"$/g, '').replace(/""/g, '"');
        
        // Inject the fetched application directly into the current browser document
        document.open();
        document.write(rawCode);
        document.close();
      } catch (error) {
        document.getElementById('loadingScreen').innerHTML = `
          <h2 style="color: #ef4444;">Connection Error</h2>
          <p style="font-size: 0.8rem; color: #9ca3af;">Could not reach Google Sheets to load the app engine.</p>
          <button onclick="location.reload()" style="margin-top: 15px; padding: 8px 16px; background: #d97706; border: none; color: #fff; border-radius: 4px; cursor: pointer;">Retry Connection</button>
        `;
      }
    }

    // Initialize the bridge on load
    window.onload = loadAppEngine;
  </script>
</body>
</html>
